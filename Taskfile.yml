version: '3'

tasks:
  test:
    desc: Run go vet and race-enabled unit tests
    cmds:
      - go vet ./...
      - go test -race -count=1 ./...

  build:
    desc: Build static zero-dependency crashgate binary
    deps: [test]
    cmds:
      - mkdir -p bin
      - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ./bin/crashgate ./cmd/crashgate

  fmt:
    desc: Format Go source files
    cmds:
      - gofmt -w .

  check:nix:
    desc: Verify flake.nix and sandboxed Nix build stay in sync with go.mod
    cmds:
      - nix flake check --no-build
      - nix build --no-link
      - nix run . -- --version

  check:all:
    desc: Run Go checks plus Nix flake drift verification
    deps: [test, "check:nix"]
